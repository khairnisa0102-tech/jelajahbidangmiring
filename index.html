<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelajah Bidang Miring</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: system-ui, sans-serif; margin: 20px; background: #f0f4f8; color: #333; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); max-width: 500px; margin: auto; }
        h1 { text-align: center; color: #0284c7; }
        .status { text-align: center; font-weight: bold; margin-bottom: 15px; }
        .online { color: #16a34a; }
        .offline { color: #dc2626; }
        .btn { display: block; width: 100%; padding: 10px; background: #0284c7; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #0369a1; }
        input { width: 100%; padding: 8px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>

<div class="card">
    <h1>⛰️ Jelajah Bidang Miring</h1>
    <div id="statusSec" class="status online">☁ Tersinkron</div>
    
    <div id="guruSec">
        <h3>Menu Guru</h3>
        <input type="password" id="passGuru" placeholder="Kata Sandi Guru">
        <input type="text" id="kodeSesi" placeholder="Kode Sesi Kelas (Misal: FISIKA1)">
        <button class="btn" onclick="bukaSesi()">Buka Sesi Kelas</button>
    </div>
    
    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
    
    <div id="muridSec">
        <h3>Menu Murid</h3>
        <input type="text" id="namaMurid" placeholder="Nama Lengkap Anda">
        <input type="text" id="masukKodeSesi" placeholder="Masukkan Kode Sesi">
        <input type="number" id="nilaiKuis" placeholder="Nilai Kuis (0-100)">
        <button class="btn" onclick="kirimNilai()">Kirim Nilai Kuis</button>
    </div>
</div>

<script>
// Konfigurasi Database Supabase Anda
const URL_SUPABASE = 'https://hddlkauooelfcjkyuejw.supabase.co/rest/v1/';
const ANON_KEY = 'sb_publishable_bOKgoHKZ1tz1eYxMDCfz0g_qncFdw7q';

const supabaseClient = supabase.createClient(URL_SUPABASE, ANON_KEY);

// Cek Koneksi Online/Offline
window.addEventListener('online', () => {
    document.getElementById('statusSec').textContent = '☁ Tersinkron';
    document.getElementById('statusSec').className = 'status online';
});
window.addEventListener('offline', () => {
    document.getElementById('statusSec').textContent = '⚠ Offline';
    document.getElementById('statusSec').className = 'status offline';
});

async function bukaSesi() {
    const pwd = document.getElementById('passGuru').value;
    const code = document.getElementById('kodeSesi').value;
    if(!pwd || !code) return alert('Mohon isi sandi dan kode sesi!');
    
    const { data, error } = await supabaseClient.from('sessions').insert([{ session_code: code, teacher_password: pwd }]);
    if(error) return alert('Gagal membuka sesi: ' + error.message);
    alert('Sesi kelas ' + code + ' berhasil dibuka secara online!');
}

async function kirimNilai() {
    const name = document.getElementById('namaMurid').value;
    const code = document.getElementById('masukKodeSesi').value;
    const score = document.getElementById('nilaiKuis').value;
    if(!name || !code || !score) return alert('Mohon lengkapi data murid!');
    
    const { data, error } = await supabaseClient.from('student_results').insert([{ session_code: code, student_name: name, score: parseInt(score) }]);
    if(error) return alert('Gagal mengirim nilai: ' + error.message);
    alert('Nilai kuis berhasil dikirim ke database guru!');
}
</script>
</body>
</html>
