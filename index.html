<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelajah Bidang Miring</title>
    <!-- Memuat Library Supabase resmi agar sistem sinkronisasi berjalan -->
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-main: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-main); color: var(--text-main); padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; display: grid; grid-template-columns: 1fr; gap: 20px; }
        @media (min-width: 768px) { .container { grid-template-columns: 1.2fr 1fr; } }
        .card { background: var(--card-bg); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03); border: 1px solid var(--border); }
        .header { text-align: center; margin-bottom: 10px; width: 100%; max-width: 900px; position: relative; }
        .header h1 { font-size: 1.8rem; color: #0f172a; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-top: 8px; }
        .online { background: #dcfce7; color: #15803d; }
        .offline { background: #fee2e2; color: #b91c1c; }
        .sim-canvas-container { width: 100%; background: #f1f5f9; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid var(--border); margin-bottom: 15px; }
        canvas { display: block; width: 100%; height: auto; background: #f1f5f9; }
        .control-group { margin-bottom: 16px; }
        .control-group label { display: block; font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #475569; }
        .control-group input[type="range"] { width: 100%; height: 6px; background: #cbd5e1; border-radius: 3px; outline: none; }
        .control-group input[type="text"], .control-group input[type="password"], .control-group input[type="number"] { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; transition: border 0.2s; }
        .control-group input:focus { border-color: var(--primary); }
        .btn { display: block; width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; text-align: center; }
        .btn:hover { background: var(--primary-hover); }
        .data-display { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }
        .data-box { background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px solid var(--border); text-align: center; }
        .data-box span { display: block; font-size: 0.8rem; color: #64748b; font-weight: 600; text-transform: uppercase; }
        .data-box strong { font-size: 1.2rem; color: #0f172a; }
        .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 14px; color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 6px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>

<div class="header">
    <h1>⛰️ Jelajah Bidang Miring</h1>
    <div id="statusSec" class="status-badge online">● ☁ Tersinkron</div>
</div>

<div class="container">
    <!-- Kiri: Simulasi Visual Visual -->
    <div class="card">
        <div class="section-title">🕹️ Simulasi Visual</div>
        <div class="sim-canvas-container">
            <canvas id="simCanvas" width="500" height="300"></canvas>
        </div>
        <div class="control-group">
            <label id="labelSudut">Sudut Kemiringan: 30°</label>
            <input type="range" id="inputSudut" min="10" max="60" value="30" oninput="updateSimulasi()">
        </div>
        <div class="control-group">
            <label id="labelMassa">Massa Balok: 5 kg</label>
            <input type="range" id="inputMassa" min="1" max="10" value="5" oninput="updateSimulasi()">
        </div>
        <div class="data-display">
            <div class="data-box"><span>Gaya Berat (W)</span><strong id="valW">50 N</strong></div>
            <div class="data-box"><span>Gaya Sejajar (F)</span><strong id="valF">25.0 N</strong></div>
            <div class="data-box"><span>Keuntungan Mekanis</span><strong id="valKM">2.0</strong></div>
            <div class="data-box"><span>Efisiensi</span><strong>100%</strong></div>
        </div>
    </div>

    <!-- Kanan: Panel Integrasi Kelas & Kuis -->
    <div class="card" style="display: flex; flex-direction: column; gap: 20px;">
        <div>
            <div class="section-title">👨‍🏫 Panel Guru (Sesi Kelas)</div>
            <div class="grid-2">
                <div class="control-group">
                    <input type="password" id="passGuru" placeholder="Sandi Guru">
                </div>
                <div class="control-group">
                    <input type="text" id="kodeSesi" placeholder="Kode Sesi (e.g. FISIKA1)">
                </div>
            </div>
            <button class="btn" onclick="bukaSesi()">Buka Sesi Kelas Baru</button>
        </div>

        <div>
            <div class="section-title">✍️ Evaluasi Murid (Kirim Nilai)</div>
            <div class="control-group">
                <input type="text" id="namaMurid" placeholder="Nama Lengkap Siswa">
            </div>
            <div class="grid-2">
                <div class="control-group">
                    <input type="text" id="masukKodeSesi" placeholder="Kode Sesi">
                </div>
                <div class="control-group">
                    <input type="number" id="nilaiKuis" placeholder="Nilai Kuis (0-100)">
                </div>
            </div>
            <button class="btn" style="background: #10b981;" onclick="kirimNilai()">Kirim Hasil Kuis</button>
        </div>
    </div>
</div>

<script>
// ==========================================
// KONFIGURASI DATABASE UTUH SUPABASE ANDA
// ==========================================
const URL_SUPABASE = 'https://supabase.co'; 
const ANON_KEY = 'sb_publishable_bOKgOHKz1tz1eYxMDCfz0g_qncfDw7q'; 

const supabaseClient = supabase.createClient(URL_SUPABASE, ANON_KEY);

// Fungsi Pemantau Koneksi Otomatis (☁ Tersinkron / ⚠ Offline)
window.addEventListener('online', () => {
    document.getElementById('statusSec').textContent = '● ☁ Tersinkron';
    document.getElementById('statusSec').className = 'status-badge online';
});
window.addEventListener('offline', () => {
    document.getElementById('statusSec').textContent = '● ⚠ Offline';
    document.getElementById('statusSec').className = 'status-badge offline';
});

// Sistem Animasi & Render Canvas Simulasi Bidang Miring
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');

function updateSimulasi() {
    const sudut = parseInt(document.getElementById('inputSudut').value);
    const massa = parseInt(document.getElementById('inputMassa').value);
    
    document.getElementById('labelSudut').textContent = `Sudut Kemiringan: ${sudut}°`;
    document.getElementById('labelMassa').textContent = `Massa Balok: ${massa} kg`;
    
    const g = 10;
    const berat = massa * g;
    const rad = sudut * (Math.PI / 100);
    const gayaSejajar = berat * Math.sin(rad);
    const km = 1 / Math.sin(rad);
    
    document.getElementById('valW').textContent = `${berat} N`;
    document.getElementById('valF').textContent = `${gayaSejajar.toFixed(1)} N`;
    document.getElementById('valKM').textContent = km.toFixed(1);
    
    // Gambar Ulang Canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Dasar & Papan Miring
    ctx.beginPath();
    ctx.moveTo(50, 250);
    ctx.lineTo(450, 250); // Lantai bawah
    
    const tebalX = 400;
    const tinggiY = tebalX * Math.tan(rad);
    const targetY = 250 - Math.min(tinggiY, 180);
    
    ctx.lineTo(50, targetY); // Papan miring naik
    ctx.closePath();
    ctx.fillStyle = '#cbd5e1';
    ctx.fill();
    ctx.strokeStyle = '#94a3b8';
    ctx.lineWidth = 3;
    ctx.stroke();
    
    // Kotak Beban Balok di Atas Papan
    ctx.save();
    ctx.translate(220, 250 - (Math.min(tinggiY, 180)/2));
    ctx.rotate(-rad);
    ctx.fillStyle = '#f97316';
    ctx.fillRect(-25, -25, 50, 50);
    ctx.strokeStyle = '#ea580c';
    ctx.lineWidth = 2;
    ctx.strokeRect(-25, -25, 50, 50);
    ctx.restore();
}

// Jalankan simulasi visual pertama kali saat halaman dimuat
updateSimulasi();

// Fungsi Backend API Supabase Kelas
async function bukaSesi() {
    const pwd = document.getElementById('passGuru').value;
    const code = document.getElementById('kodeSesi').value;
    if(!pwd || !code) return alert('Mohon isi sandi dan kode sesi!');
    
    const { data, error } = await supabaseClient.from('sessions').insert([{ session_code: code, teacher_password: pwd }]);
    if(error) return alert('Gagal membuka sesi: ' + error.message);
    alert('Sesi kelas ' + code + ' berhasil dibuka secara online!');
}

async function kirimNilai() {
    const name = document.getElementById('namaMurid').value;
    const code = document.getElementById('masukKodeSesi').value;
    const score = document.getElementById('nilaiKuis').value;
    if(!name || !code || !score) return alert('Mohon lengkapi data murid!');
    
    const { data, error } = await supabaseClient.from('student_results').insert([{ session_code: code, student_name: name, score: parseInt(score) }]);
