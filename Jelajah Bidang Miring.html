<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>Jelajah Bidang Miring</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fbf8f0;--card:#fff;--tx:#17243a;--mut:#51607a;--b:#1d5fc4;--bl:#e3edfb;--g:#1f8a5b;--gl:#dff3e8;--o:#e8710a;--bd:#d6dce8;--r:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1624;--card:#18223a;--tx:#eef2fa;--mut:#a9b6cf;--b:#7db2ff;--bl:#1d2f52;--g:#5fd6a0;--gl:#123a2b;--o:#ffa04d;--bd:#33425f;--r:#ff8a7a}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--b);color:#fff;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
:root:not([data-theme=light]) header{}
header b{font-size:18px}header .sp{flex:1}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:0 0 14px}
h1,h2,h3{margin:.2em 0 .4em;line-height:1.25}
button,.btn{font:inherit;font-weight:600;border:2px solid var(--b);background:var(--card);color:var(--b);padding:9px 16px;border-radius:10px;cursor:pointer;min-height:44px}
button.p{background:var(--o);border-color:var(--o);color:#fff}button.g{background:var(--g);border-color:var(--g);color:#fff}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--o);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:10px;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
textarea{min-height:76px;resize:vertical}label{display:block;font-weight:600;margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{padding:6px 12px;min-height:40px}.tabs button.on{background:var(--b);color:#fff}
.bar{height:12px;background:var(--bl);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
.timer{background:var(--bl);color:var(--b);padding:4px 12px;border-radius:20px;font-weight:700}.timer.w{background:var(--o);color:#fff}
.opt{display:block;width:100%;text-align:left;margin:6px 0;font-weight:500}.opt.sel{background:var(--bl);border-color:var(--g)}
table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:left;font-size:14px}
.sc{overflow-x:auto}.note{background:var(--gl);border-left:5px solid var(--g);padding:8px 12px;border-radius:8px;margin:8px 0}
.warn{background:#fff3e0;color:#5a3300;border-left:5px solid var(--o);padding:8px 12px;border-radius:8px;margin:8px 0}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;background:var(--bl);font-size:13px;font-weight:600}
.big{font-size:44px;font-weight:800;color:var(--b)}.hb{display:flex;align-items:center;gap:8px;margin:3px 0}.hb span.l{width:150px;font-size:13px}.hb .bar{flex:1}
.mood button{font-size:26px;padding:4px 10px}.mood button.sel{background:var(--bl);border-color:var(--g)}
small,.mut{color:var(--mut)}#sv{font-size:13px}
</style></head><body>
<header><b>⛰️ JELAJAH BIDANG MIRING</b><span class="sp"></span><span id="tm"></span><span id="sv" role="status"></span><button id="mode" style="min-height:36px;padding:4px 12px"></button></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S,me=null,view='murid',tab=0,qi=0,draft={},tick;
const K='jbm_v1';
function dlg(msg,o={}){return new Promise(res=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;z-index:99;padding:16px';d.innerHTML=`<div class=card role=dialog aria-modal=true style="max-width:440px;width:100%;margin:0"><p style="white-space:pre-wrap">${esc(msg)}</p>${o.input!=null?`<input id=dli value="${esc(o.input)}">`:''}<div class=row style="justify-content:flex-end">${o.alert?'':'<button id=dlc>Batal</button>'}<button class=p id=dlo>OK</button></div></div>`;document.body.appendChild(d);const done=v=>{d.remove();res(v)};$('#dlo').onclick=()=>done(o.input!=null?$('#dli').value:true);if($('#dlc'))$('#dlc').onclick=()=>done(o.input!=null?null:false);($('#dli')||$('#dlo')).focus()})}
const ask=m=>dlg(m),say=m=>dlg(m,{alert:1}),askv=(m,v)=>dlg(m,{input:v});
function load(){try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||{pin:null,sess:{code:'',open:false},st:[],gr:{},made:false,G:0,test:false};try{me=localStorage.getItem('jbm_me')}catch(e){}}
function save(){try{localStorage.setItem(K,JSON.stringify(S));$('#sv').textContent='✓ Tersimpan '+new Date().toLocaleTimeString('id-ID')}catch(e){$('#sv').textContent='⚠ Gagal menyimpan'}}
const mine=()=>S.st.find(s=>s.id===me);
const PRE=[["Gaya adalah ...",["tarikan atau dorongan","massa benda","jarak tempuh","lamanya gerak"]],["Satuan gaya dalam SI adalah ...",["newton (N)","joule (J)","meter (m)","kilogram (kg)"]],["Alat berikut yang termasuk pesawat sederhana adalah ...",["katrol","lampu","kabel listrik","baterai"]],["Manakah yang merupakan bidang miring?",["papan untuk menaikkan barang ke bak kendaraan","roda sepeda","jungkat-jungkit","timbangan dapur"]],["Ciri utama bidang miring adalah ...",["permukaan datar yang dipasang miring","batang yang bertumpu pada satu titik","roda yang diberi tali","dua roda bergigi"]],["Jalan di perbukitan Gunungkidul dibuat berkelok agar ...",["lintasan lebih panjang sehingga gaya yang diperlukan lebih kecil","lintasan lebih pendek","kendaraan menjadi lebih berat","gesekan menjadi nol"]],["Jalur landai untuk kursi roda dibuat panjang supaya ...",["gaya dorong lebih kecil","tinggi bertambah","berat pengguna berkurang","usaha menjadi nol"]],["Tinggi sama, panjang bidang miring ditambah. Gaya ideal yang diperlukan ...",["semakin kecil","semakin besar","tetap","menjadi nol"]],["Pada bidang miring yang sama, makin berat benda, gaya kuasa yang diperlukan ...",["makin besar","makin kecil","tetap","nol"]],["Bidang miring panjang 6 m dan tinggi 2 m. Keuntungan mekanisnya (KM = s/h) adalah ...",["3","4","8","12"]]];
const POST=[["Bidang miring adalah ...",["permukaan miring untuk memindahkan benda ke tempat lebih tinggi/rendah dengan gaya lebih kecil","batang yang bertumpu pada titik","roda berporos","katrol tetap"]],["Pada bidang miring ideal (tanpa gesekan), yang menjadi lebih kecil adalah ...",["gaya kuasa","usaha yang dilakukan","berat benda","tinggi tujuan"]],["Contoh penerapan bidang miring adalah ...",["jalur landai kursi roda","kipas angin","lampu belajar","termos"]],["Sekrup merupakan penerapan prinsip ...",["bidang miring yang dililitkan pada silinder","tuas jenis pertama","katrol bergerak","roda bergigi"]],["Bidang miring dengan s = 5 m dan h = 1 m memiliki KM ...",["5","1","0,2","6"]],["KM sebesar 3 berarti ...",["gaya ideal sepertiga berat benda","gaya ideal tiga kali berat benda","tinggi tiga kali panjang","usaha menjadi tiga kali"]],["W = 300 N, s = 3 m, h = 1 m. Gaya ideal F = (W × h)/s adalah ...",["100 N","300 N","900 N","10 N"]],["W = 500 N, s = 5 m, h = 2 m. Gaya ideal adalah ...",["200 N","250 N","100 N","500 N"]],["Gaya ideal F = 150 N, W = 600 N, s = 8 m. Tinggi bidang miring h = ...",["2 m","4 m","1 m","3 m"]],["Dua jalur menuju tempat setinggi sama. Jalur B dua kali lebih panjang dari jalur A. Secara ideal, gaya di jalur B ...",["setengah gaya di jalur A","dua kali gaya di jalur A","sama dengan jalur A","nol"]]];
const rot=i=>[0,1,2,3].map(k=>(k+i)%4); // urutan tampil: jawaban benar (indeks 0) berpindah posisi
const L='ABCD';
function fmt(t){const m=Math.floor(t/60),s=t%60;return m+':'+String(s).padStart(2,'0')}
function tickFn(){clearInterval(tick);tick=setInterval(()=>{const s=mine(),el=$('#tm');if(!s||view!=='murid'){el.innerHTML='';return}
 const st=stage(s),M={pre:['t0',300],post:['t1',600],ref:['t3',180]}[st];if(!M||!s[M[0]]){el.innerHTML='';return}
 const left=Math.max(0,M[1]-Math.floor((Date.now()-s[M[0]])/1000));el.innerHTML='<span class="timer '+(left<=60?'w':'')+'" role=timer>⏱ '+fmt(left)+(left<=60?' · waktu hampir habis':'')+'</span>';
 if(left===0){if(st==='ref'){s.ref=s.refd||{r1:'',r2:'',r3:'',r4:'',r5:'',r6:''};s.ref.auto=true;save();render()}else submitTest(st,true)}},1000)}
function stage(s){if(!s.pre)return'pre';if(s.group==null)return'wait';if(!s.ex0)return'intro';if(!s.ex1)return'lab';if(!s.sd)return'simp';if(!s.post)return'post';if(!s.ref)return'ref';return'done'}
/* ---------- ranking & kelompok ---------- */
function ranked(){return S.st.filter(s=>s.pre).sort((a,b)=>b.pre.score-a.pre.score||a.pre.sec-b.pre.sec||(+a.no-+b.no)||a.id.localeCompare(b.id))}
async function makeGroups(){const R=ranked(),n=R.length;if(!n)return say('Belum ada murid yang menyelesaikan pretest.');
 let G=8;if(n!==32){const d=Math.max(3,Math.ceil(n/4));const v=await askv('Peringatan: jumlah murid '+n+' (bukan 32), sehingga 8 kelompok × 4 anggota tidak dapat dipaksakan. Tidak ada murid yang dihilangkan; anggota dibagi merata.\nMasukkan jumlah kelompok yang Anda setujui (disarankan '+d+'):',d);G=parseInt(v);if(!G||G<3||G>n)return say('Jumlah kelompok tidak valid (minimal 3 dan tidak melebihi jumlah murid).')}
 const nM=Math.max(1,Math.round(G*2/8)),nB=Math.max(1,Math.round(G*3/8)),nT=G-nM-nB;
 if(n!==32&&!(await ask('Setujui pembagian '+G+' kelompok ('+nM+' Mahir, '+nB+' Berkembang, '+nT+' Terbimbing) untuk '+n+' murid?')))return;
 const cats=[];for(let g=0;g<G;g++)cats.push(g<nM?'Mahir':g<nM+nB?'Berkembang':'Terbimbing');
 const base=Math.floor(n/G),ex=n%G;let i=0;for(let g=0;g<G;g++){const sz=base+(g<ex?1:0);for(let k=0;k<sz;k++){R[i].group=g+1;R[i].rank=i+1;i++}}
 S.G=G;S.cats=cats;S.made=true;save();render()}
async function resetGroups(){if(S.st.some(s=>s.ex0))return say('Eksplorasi sudah dimulai. Kelompok tidak dapat diatur ulang.');if(!(await ask('Atur ulang pembagian kelompok?')))return;S.st.forEach(s=>{s.group=null;s.rank=null});S.cats=[];S.made=false;save();render()}
async function late(){const ls=ranked().filter(s=>s.group==null);if(!S.made||!ls.length)return say('Tidak ada murid terlambat.');ls.forEach(s=>{const c=s.pre.score>=80?'Mahir':s.pre.score>=60?'Berkembang':'Terbimbing';let gs=S.cats.map((x,i)=>[i+1,x]).filter(x=>x[1]===c).map(x=>x[0]);const cnt=g=>S.st.filter(x=>x.group===g).length;gs.sort((a,b)=>cnt(a)-cnt(b)||a-b);s.group=gs[0]});save();render()}
/* ---------- submit ---------- */
function submitTest(k,auto){const s=mine();if(!s||s[k])return;const Q=k==='pre'?PRE:POST,a=draft[k]||s[k+'d']||{};let sc=0;Q.forEach((q,i)=>{if(a[i]===0)sc+=10});const t0=k==='pre'?s.t0:s.t1;s[k]={ans:a,score:sc,sec:Math.min(Math.floor((Date.now()-t0)/1000),k==='pre'?300:600)};save();qi=0;render()}
/* ---------- render murid ---------- */
function render(){$('#mode').textContent=view==='murid'?'🔒 Mode Guru':'👩‍🎓 Mode Murid';tickFn();if(view==='guru')return renderGuru();const s=mine();if(!s)return renderHome();({pre:()=>renderTest('pre'),wait:renderWait,intro:renderIntro,lab:renderLab,simp:renderSimp,post:()=>renderTest('post'),ref:renderRef,done:renderDone})[stage(s)]()}
let ident=false;
function renderHome(){if(!ident){$('#app').innerHTML=`<div class=card><h1>JELAJAH BIDANG MIRING</h1><p><b>Temukan Konsepnya, Buktikan Manfaatnya!</b></p><p>IPA · Kelas VIII · Pesawat Sederhana: Bidang Miring</p>${rampSVG()}<p>Tujuanmu hari ini: menjelaskan bidang miring, menemukan hubungan W, F, s, dan h, lalu menyimpulkannya bersama kelompok.</p><button class=p id=go>MULAI PETUALANGAN</button></div>`;$('#go').onclick=()=>{ident=true;render()};return}
 $('#app').innerHTML=`<div class=card><h2>Isi identitasmu</h2><label for=n>Nama lengkap</label><input id=n autocomplete=name><label for=no>Nomor presensi</label><input id=no type=number min=1 max=99><label for=kl>Kelas</label><select id=kl>${['VIIIA','VIIIB','VIIIC','VIIID','VIIIE','VIIIF','VIIIG'].map(x=>`<option>${x}</option>`).join('')}</select><label for=cd>Kode sesi (dari gurumu)</label><input id=cd autocapitalize=characters><p id=er class=warn hidden></p><button class=p id=sv2>Simpan Identitas dan Lanjutkan</button></div>`;
 $('#sv2').onclick=async()=>{const n=$('#n').value.trim(),no=$('#no').value.trim(),kl=$('#kl').value,cd=$('#cd').value.trim().toUpperCase(),er=$('#er');const bad=m=>{er.hidden=false;er.textContent=m};
 if(n.length<3)return bad('Tulis nama lengkapmu (minimal 3 huruf).');if(!(+no>0))return bad('Nomor presensi harus berupa angka.');if(!S.sess.code)return bad('Guru belum membuat sesi. Tunggu sebentar ya.');if(cd!==S.sess.code)return bad('Kode sesi belum tepat. Coba tanya gurumu.');if(!S.sess.open)return bad('Sesi belum dibuka oleh guru.');
 const dup=S.st.find(x=>x.kelas===kl&&String(x.no)===no);if(dup){if(dup.name.toLowerCase()!==n.toLowerCase())return bad('Nomor presensi '+no+' di kelas '+kl+' sudah dipakai murid lain. Periksa lagi, atau hubungi guru.');if(!(await ask('Identitas ini sudah terdaftar. Lanjutkan sebagai '+dup.name+'?')))return;me=dup.id}else{const id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);S.st.push({id,name:n,no,kelas:kl,group:null,test:false});me=id}
 try{localStorage.setItem('jbm_me',me)}catch(e){}save();render()}}
function renderTest(k){const s=mine(),Q=k==='pre'?PRE:POST,t=k==='pre'?'Seberapa Jauh Kamu Mengenal Bidang Miring?':'Uji Pemahamanmu!',lim=k==='pre'?5:10,tk=k==='pre'?'t0':'t1';
 if(!s[tk]){$('#app').innerHTML=`<div class=card><h2>${t}</h2><p>${Q.length} soal pilihan ganda · ${lim} menit · satu soal per layar. Setelah dikirim, jawaban tidak bisa diubah. Jika waktu habis, jawabanmu terkumpul otomatis. Jawab sebisamu — ini untuk mengenal dirimu, bukan untuk menghakimi.</p><button class=p id=st>Mulai</button></div>`;$('#st').onclick=()=>{s[tk]=Date.now();save();render()};return}
 draft[k]=draft[k]||s[k+'d']||{};const a=draft[k],i=qi,o=rot(i);
 $('#app').innerHTML=`<div class=card><div class=row><b>Soal ${i+1} dari ${Q.length}</b><span class=sp style="flex:1"></span><small>Terjawab: ${Object.keys(a).length}/${Q.length}</small></div><div class=bar><i style="width:${(i+1)/Q.length*100}%"></i></div><h3>${esc(Q[i][0])}</h3><div role=radiogroup>${o.map((oi,p)=>`<button class="opt ${a[i]===oi?'sel':''}" data-o="${oi}" role=radio aria-checked="${a[i]===oi}">${L[p]}. ${esc(Q[i][1][oi])}</button>`).join('')}</div><div class=row style="margin-top:10px"><button id=pv ${i?'':'disabled'}>← Sebelumnya</button>${i<Q.length-1?'<button id=nx class=g>Berikutnya →</button>':'<button id=sb class=p>Kirim Jawaban</button>'}</div></div>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{a[i]=+b.dataset.o;s[k+'d']=a;save();render()});
 $('#pv').onclick=()=>{qi--;render()};if($('#nx'))$('#nx').onclick=()=>{qi++;render()};if($('#sb'))$('#sb').onclick=()=>{const m=Q.length-Object.keys(a).length;ask(m?m+' soal belum dijawab. Tetap kirim?':'Kirim jawaban sekarang?').then(y=>{if(y)submitTest(k)})}}
function scoreCard(s,k){return `<div class=card><h2>Nilai ${k==='pre'?'pretest':'posttest'}-mu</h2><div class=big>${s[k].score}</div><p>${s[k].score>=80?'Luar biasa! Kamu sudah punya bekal yang kuat.':s[k].score>=60?'Bagus! Kamu sedang berkembang, terus jelajahi ya.':'Terima kasih sudah berusaha. Di kelompok nanti kamu akan dibantu dan membantu teman — semua bisa tumbuh.'}</p><small>Kunci jawaban dibahas guru setelah seluruh kelas selesai.</small></div>`}
function renderWait(){const s=mine();$('#app').innerHTML=scoreCard(s,'pre')+`<div class=card><h3>Menunggu pembagian kelompok…</h3><p>Guru akan membagi kelompok. Halaman ini akan menyesuaikan saat kamu masuk ke kelompok.</p><button id=rf>Periksa lagi</button></div>`;$('#rf').onclick=()=>{load();render()};clearInterval(window.wp);window.wp=setInterval(()=>{load();const q=mine();if(q&&stage(q)!=='wait'){clearInterval(window.wp);render()}},4000)}
/* ---------- laboratorium eksplorasi ---------- */
const CATS=['Mahir','Berkembang','Terbimbing'],CC={Mahir:'var(--g)',Berkembang:'var(--b)',Terbimbing:'var(--o)'},catOf=g=>(S.cats||[])[g-1]||'Berkembang';
let ws=0;
function rampSVG(h=2,s=4,p=.45,ar=false){const k=26,x=Math.sqrt(Math.max(s*s-h*h,.01))*k,H=h*k,x0=24,y0=170,bx=x0+x*p,by=y0-H*p,L=Math.hypot(x,H),ux=x/L,uy=-H/L,a=-Math.atan2(H,x)*57.3;
return `<svg viewBox="0 0 ${Math.max(x+90,300)} 200" style="width:100%;max-width:520px" role=img aria-label="Diagram bidang miring: panjang s ${s} m, tinggi h ${h} m"><defs><marker id=ar markerWidth=8 markerHeight=8 refX=6 refY=4 orient=auto><path d="M0,0 L8,4 L0,8z" fill="#c0392b"/></marker></defs><polygon points="${x0},${y0} ${x0+x},${y0} ${x0+x},${y0-H}" fill="#cfe0fa" stroke="#1d5fc4" stroke-width="3"/><g transform="rotate(${a} ${bx} ${by})"><rect x="${bx-14}" y="${by-26}" width="28" height="24" fill="#e8710a"/></g>${ar?`<line x1="${bx}" y1="${by-14}" x2="${bx}" y2="${by+22}" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/><text x="${bx+8}" y="${by+24}" font-size="14" font-weight="700" fill="#c0392b">W ↓</text><line x1="${bx}" y1="${by-14}" x2="${bx+ux*44}" y2="${by-14+uy*44}" stroke="#c0392b" stroke-width="3" marker-end="url(#ar)"/><text x="${bx+ux*44+4}" y="${by-14+uy*44-4}" font-size="14" font-weight="700" fill="#c0392b">F ↗</text>`:''}<text x="${x0+x/2-30}" y="${y0-H/2-34}" font-size="14" fill="#1d5fc4" font-weight="700">s = ${s} m</text><text x="${x0+x+6}" y="${y0-H/2}" font-size="14" fill="#1f8a5b" font-weight="700">h = ${h} m</text></svg>`}
function simHTML(id,mode){const sl=(n,l,u,mn,mx,st,v,hd)=>`<div ${hd?'hidden':''}><label for=${id}${n}>${l}: <b id=${id}${n}v>${v}</b> ${u}</label><input type=range id=${id}${n} min=${mn} max=${mx} step=${st} value=${v}></div>`;return `<div class=card><div class=grid>${sl('W','Berat benda W','N',50,500,10,200,mode<2)}${sl('s','Panjang bidang miring s','m',1,10,.5,4)}${sl('h','Tinggi bidang miring h','m',.5,5,.5,2)}</div><div class=row><button id=${id}go>▶ Gerakkan benda</button></div><div id=${id}o></div></div>`}

 if(gt===4)b=`<div class="card sc"><table><tr><th>Nama<th>Kelas<th>Pre<th>Post<th>Selisih</tr>${S.st.map(s=>`<tr><td>${esc(s.name)}<td>${s.kelas}<td>${s.pre?.score??'-'}<td>${s.post?.score??'-'}<td>${s.pre&&s.post?s.post.score-s.pre.score:'-'}</tr>`).join('')}</table></div>`;
 if(gt===5)b=S.st.filter(s=>s.ref).map(s=>`<div class=card><b>${esc(s.name)}</b> ${s.ref.r5}<br><small>Baru: ${esc(s.ref.r1)}<br>Membantu: ${esc(s.ref.r2)}<br>Sulit: ${esc(s.ref.r3)}<br>Cara: ${esc(s.ref.r4)}<br>Kontribusi: ${esc(s.ref.r6)}</small></div>`).join('')||'<div class=card>Belum ada refleksi.</div>';
 if(gt===6)b=`<div class=card><button class=g id=ex>Unduh rekap CSV</button><p><small>Jika unduhan tidak tersedia di tampilan ini, berkas disalin ke papan klip.</small></p></div>`;
 $('#app').innerHTML=`<div class=tabs>${T.map((t,i)=>`<button class="${gt===i?'on':''}" data-g=${i}>${t}</button>`).join('')}</div>`+b;
 document.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{gt=+x.dataset.g;render()});
 const on=(i,f)=>{if($('#'+i))$('#'+i).onclick=f};
 on('sc',()=>{S.sess.code=$('#cd').value.trim().toUpperCase();save();render()});on('op',()=>{if(!S.sess.code)return say('Isi kode sesi dahulu.');S.sess.open=!S.sess.open;save();render()});
 on('mk',makeGroups);on('rs',resetGroups);on('lt',late);
 on('rk',async()=>{if(!(await ask('Hapus SEMUA pekerjaan murid? Tindakan ini tidak bisa dibatalkan. Pastikan rekap sudah diunduh.')))return;const v=await askv('Ketik HAPUS untuk mengonfirmasi:','');if(v!=='HAPUS')return;S.st=[];S.gr={};S.cats=[];S.made=false;S.G=0;S.sess.open=false;try{localStorage.removeItem('jbm_me')}catch(e){}me=null;save();render()});on('dm',()=>{for(let i=1;i<=32;i++){const sc=Math.min(100,Math.round(Math.random()*10)*10);S.st.push({id:'t'+i+Date.now(),name:'Murid Uji '+i,no:String(i),kelas:'VIIIA',group:null,test:true,pre:{ans:{},score:sc,sec:60+Math.floor(Math.random()*200)}})}save();render()});
 on('dd',async()=>{if(!(await ask('Hapus semua data uji?')))return;S.st=S.st.filter(s=>!s.test);S.made=false;S.gr={};S.st.forEach(s=>s.group=null);save();render()});
 on('ex',async()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['Nama','Presensi','Kelas','Kelompok','Kategori TaRL','Ranking','Pretest','Waktu pretest (dtk)','Posttest','Selisih','Suasana hati','Pengetahuan baru','Aktivitas membantu','Kesulitan','Cara mengatasi','Kontribusi','Mulai eksplorasi','Selesai eksplorasi','Durasi eksplorasi (dtk)','Simpulan'],...S.st.map(s=>[s.name,s.no,s.kelas,s.group??'',s.group?catOf(s.group):'',s.pre?R.indexOf(s)+1:'',s.pre?.score??'',s.pre?.sec??'',s.post?.score??'',s.pre&&s.post?s.post.score-s.pre.score:'',s.ref?.r5??'',s.ref?.r1??'',s.ref?.r2??'',s.ref?.r3??'',s.ref?.r4??'',s.ref?.r6??'',s.ex0?new Date(s.ex0).toISOString():'',s.ex1?new Date(s.ex1).toISOString():'',s.ex0&&s.ex1?Math.round((s.ex1-s.ex0)/1000):'',s.sd?'ya':''])].map(r=>r.map(q).join(',')).join('\n');
  try{const d=await claude.use('downloads');if(d){await d.save({filename:'rekap-bidang-miring.csv',data:new Blob(['\ufeff'+rows],{type:'text/csv'})});return}}catch(e){}try{await navigator.clipboard.writeText(rows);say('CSV disalin ke papan klip.')}catch(e){askv('Salin CSV:',rows.slice(0,3000))}})}
$('#mode').onclick=()=>{view=view==='murid'?'guru':'murid';render()};
window.addEventListener('storage',e=>{if(e.key===K&&!/TEXTAREA|INPUT/.test(document.activeElement.tagName)){load();render()}});
load();render();
</script></body></html>
